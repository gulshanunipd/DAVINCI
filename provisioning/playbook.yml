---
# Ansible playbook that prepares a machine to build and run DAVINCI.
# It installs the system libraries, the Rust toolchain, Python and Docker,
# generates the key material, builds the three services and builds the attested
# platform image (TPM 2.0 + OP-TEE). It is written for Ubuntu 22.04
# and is used by the Vagrantfile, but you can also run it against any Ubuntu
# host with:
#
#   ansible-playbook -i "localhost," -c local provisioning/playbook.yml
#
- name: Provision the DAVINCI environment
  hosts: all
  become: true
  vars:
    project_dir: /vagrant
    run_user: vagrant

  tasks:
    - name: Install the system packages DAVINCI needs
      apt:
        name:
          - build-essential
          - pkg-config
          - libssl-dev
          - openssl
          - curl
          - git
          - python3
          - ca-certificates
          - docker.io
          - docker-buildx
          # Runs the small arm64 guest-userland stage of the platform image.
          - qemu-user-static
          - binfmt-support
        update_cache: true
        state: present

    - name: Let the run user use Docker
      user:
        name: "{{ run_user }}"
        groups: docker
        append: true

    - name: Install the Rust toolchain for the run user
      become_user: "{{ run_user }}"
      shell: >
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs
        | sh -s -- -y --default-toolchain stable
      args:
        creates: "/home/{{ run_user }}/.cargo/bin/cargo"

    - name: Generate the DAVINCI key material
      become_user: "{{ run_user }}"
      command: bash keys/gen-keys.sh
      args:
        chdir: "{{ project_dir }}"
        creates: "{{ project_dir }}/keys/am_priv.pem"

    - name: Build the three services
      become_user: "{{ run_user }}"
      shell: |
        source "$HOME/.cargo/env"
        cargo build --manifest-path pce-service/Cargo.toml
        cargo build --manifest-path attestation-manager/Cargo.toml
        cargo build --manifest-path verifier/Cargo.toml
      args:
        chdir: "{{ project_dir }}"
        executable: /bin/bash

    - name: Build the attested platform image (TPM 2.0 + OP-TEE, ~20-40 min)
      command: docker build -t davinci-platform mral-adapters
      args:
        chdir: "{{ project_dir }}"
      environment:
        DOCKER_BUILDKIT: "1"

    - name: Show how to start the services
      debug:
        msg:
          - "Provisioning finished. Enter the VM with: vagrant ssh"
          - "Then from /vagrant: make platform, the three run-* targets, make provision, make demo-compare."
